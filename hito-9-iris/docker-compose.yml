# Hito 9 — Fixture 2030 — Entidades complejas en InterSystems IRIS
# Mismo esquema que la Clase 10: Durable %SYS en ~/docker/data/iris y las clases en ./scripts.
services:
  iris:
    image: intersystems/iris-community:latest-cd
    container_name: fixture2030-iris
    restart: unless-stopped
    ports:
      - "127.0.0.1:1972:1972"
      - "127.0.0.1:52773:52773"
    environment:
      - ISC_DATA_DIRECTORY=/durable
    volumes:
      - ${HOME}/docker/data/iris:/durable
      - ./scripts:/scripts:ro
