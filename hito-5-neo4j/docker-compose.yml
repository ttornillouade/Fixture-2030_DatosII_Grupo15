services:
  neo4j:
    image: neo4j:latest
    container_name: ${NEO4J_CONTAINER_NAME:-fixture2030-neo4j}
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-fixture2030}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Sin :ro: neo4j:latest (2026.x) cambia el dueño de import/ al arrancar y falla si es de solo lectura
      - ./import:/var/lib/neo4j/import
      - ./queries:/queries:ro

volumes:
  neo4j_data:
  neo4j_logs:
