services:
  redis:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME:-fixture2030-redis}
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - ${HOME}/docker/data/redis:/data
